[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "berlin-urban-heat-twin"
version = "0.1.0"
description = "Research-oriented urban heat digital twin for Berlin"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pyproj==3.7.2",
  "shapely==2.1.2",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "mypy>=1.15,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
berlin-heat-twin = "berlin_heat_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["berlin_heat_twin"]
